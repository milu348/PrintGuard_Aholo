<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrintGuard_Aholo · 对话生成可打印模型</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --txt: #e6e9ef;
    --dim: #9aa3b2; --acc: #4f8cff; --acc2: #22c55e; --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 18px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  .chip { margin-left: auto; font-size: 12px; padding: 3px 10px; border-radius: 999px;
          border: 1px solid var(--line); color: var(--dim); }
  .chip.ok { color: var(--acc2); border-color: #1c3a26; }
  .chip.bad { color: var(--warn); border-color: #3a2f16; }
  main { max-width: 880px; margin: 0 auto; padding: 18px 16px 130px; }
  .msg { margin: 14px 0; display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .bubble { max-width: 82%; padding: 10px 14px; border-radius: 14px;
            word-break: break-word; }
  .msg.user .bubble { background: var(--acc); color: #fff; border-bottom-right-radius: 4px;
                      white-space: pre-wrap; }
  .msg.bot .bubble { background: var(--panel); border: 1px solid var(--line);
                     border-bottom-left-radius: 4px; }
  .msg.bot.loading .bubble { color: var(--dim); }
  .bubble p { margin: 6px 0; }
  .bubble a { color: var(--acc); }
  .dl { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; margin: 6px 0;
        background: var(--acc2); color: #06210f; border: 0; border-radius: 10px;
        font: inherit; font-weight: 600; cursor: pointer; }
  .dl:hover { filter: brightness(1.08); }
  .dl[disabled] { opacity: .6; cursor: default; }
  .dl small { font-weight: 400; opacity: .85; }
  .dl.big { font-size: 15px; }
  .hint { color: var(--dim); font-size: 12px; margin: 6px 0 0; }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .quick button { background: var(--panel); color: var(--txt); border: 1px solid var(--line);
                  border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .quick button:hover { border-color: var(--acc); }
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel);
    border-top: 1px solid var(--line); padding: 10px 16px;
  }
  .composer { max-width: 880px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; resize: none; background: var(--bg); color: var(--txt);
             border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
             font: inherit; max-height: 140px; }
  textarea:focus { outline: none; border-color: var(--acc); }
  .size { width: 110px; background: var(--bg); color: var(--txt);
          border: 1px solid var(--line); border-radius: 12px; padding: 10px; font: inherit; }
  button.send { background: var(--acc); color: #fff; border: 0; border-radius: 12px;
                padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  button.send:disabled { opacity: .5; cursor: not-allowed; }
  button.attach { background: var(--bg); color: var(--txt); border: 1px solid var(--line);
                  border-radius: 12px; padding: 10px 12px; font: inherit; cursor: pointer; }
  button.attach:hover { border-color: var(--acc); }
  #imageInput { display: none; }
  .thumbs { max-width: 880px; margin: 8px auto 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .thumbs:empty { display: none; }
  .thumb { position: relative; width: 64px; height: 64px; border-radius: 10px;
           border: 1px solid var(--line); overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
                  border: 0; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff;
                  font-size: 11px; line-height: 18px; cursor: pointer; padding: 0; }
</style>
</head>
<body>
<header>
  <h1>PrintGuard_Aholo</h1>
  <span class="sub">一句话 / 一张图 → 可打印 3MF</span>
  <span class="chip" id="status">检查中…</span>
</header>

<main id="chat">
  <div class="msg bot">
    <div class="bubble">你好，我是 PrintGuard_Aholo。用一句话描述、或上传一张图片（可再配一句文字说明），
      并告诉我最大边尺寸（毫米）——我会生成 3D 模型、做好可制造性修复，再把文件交给你下载。</div>
  </div>
  <div class="quick" id="quick"></div>
  <p class="hint">提示：文字 / 图片 / 图+文字都可以。纯文字最大边尺寸必填；图生 3D 也建议给尺寸。
    生成通常 1–3 分钟；模型下载链接 5 分钟内有效，请及时保存文件。</p>
</main>

<footer>
  <div class="thumbs" id="thumbs"></div>
  <div class="composer">
    <button class="attach" id="attachBtn" title="上传参考图（图生 3D / 文图混合）">📎</button>
    <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" multiple>
    <input class="size" id="size" type="number" min="5" max="10000" placeholder="最大边 mm">
    <textarea id="input" rows="1" placeholder="例如：照这张照片做一个手机支架，最大边 100mm"></textarea>
    <button class="send" id="send">发送</button>
  </div>
</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const sizeBox = document.getElementById('size');
const quickBox = document.getElementById('quick');
const attachBtn = document.getElementById('attachBtn');
const imageInput = document.getElementById('imageInput');
const thumbs = document.getElementById('thumbs');
let busy = false;
// 本回合待发送的参考图（data URI）：图生 3D / 文图混合的输入
let pendingImages = [];

const QUICK = [
  '一个简约圆柱形手机支架，壁厚 6mm，最大边 100mm',
  '桌面耳机挂钩，最大边 80mm',
  '手办级机甲小雕像，要细节，最大边 120mm',
  '带两个笔孔的桌面收纳盒，最大边 90mm',
];
QUICK.forEach(text => {
  const b = document.createElement('button');
  b.textContent = text.length > 22 ? text.slice(0, 22) + '…' : text;
  b.onclick = () => { input.value = text; input.focus(); };
  quickBox.appendChild(b);
});

/** 图片上传：转 data URI 附在消息上，服务端经 Asset 中转后喂给生成任务。 */
attachBtn.onclick = () => imageInput.click();
imageInput.addEventListener('change', () => {
  const files = Array.from(imageInput.files || []);
  imageInput.value = '';
  files.forEach(file => {
    if (!/^image\//.test(file.type)) return;
    if (file.size > 8 * 1048576) {
      alert(`图片 ${file.name} 超过 8MB，请压缩后再上传`);
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      pendingImages.push(String(reader.result));
      renderThumbs();
    };
    reader.readAsDataURL(file);
  });
});

function renderThumbs() {
  thumbs.innerHTML = '';
  pendingImages.forEach((uri, i) => {
    const box = document.createElement('div');
    box.className = 'thumb';
    const img = document.createElement('img');
    img.src = uri;
    const rm = document.createElement('button');
    rm.textContent = '×';
    rm.title = '移除这张图';
    rm.onclick = () => { pendingImages.splice(i, 1); renderThumbs(); };
    box.appendChild(img);
    box.appendChild(rm);
    thumbs.appendChild(box);
  });
}

function scrollBottom() {
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function esc(text) {
  return String(text).replace(/[&<>"']/g, ch => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function sizeLabel(bytes) {
  if (!bytes) return '';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

/** 模型：一个按钮，点了真正把文件存到本地（不打开新标签）。 */
function downloadButton(artifact, big) {
  const btn = document.createElement('button');
  btn.className = 'dl' + (big ? ' big' : '');
  const label = artifact.filename || 'printable.3mf';
  btn.textContent = '⬇ 下载模型 ' + label;
  const size = sizeLabel(artifact.size_bytes);
  if (size) {
    const s = document.createElement('small');
    s.textContent = size;
    btn.appendChild(s);
  }
  btn.onclick = async () => {
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = '下载中…';
    try {
      const resp = await fetch(artifact.url, { credentials: 'same-origin' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const blob = await resp.blob();
      const href = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = href;
      a.download = label;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(href), 5000);
      btn.textContent = '✅ 已下载 ' + label;
    } catch (err) {
      btn.textContent = '⚠️ 下载失败（' + err.message + '），请重试或复制链接';
      btn.disabled = false;
      btn.innerHTML = original;
      btn.onclick = () => window.open(artifact.url, '_blank');
    }
  };
  return btn;
}

/** 把回复文本里的 markdown 链接转成节点：模型链接→下载按钮，其余→普通超链接。 */
function renderRich(container, text, artifacts) {
  let html = esc(text);


  // [text](url)：模型链接渲染成下载按钮，其余给普通链接
  html = html.replace(/(?<!!)\[([^\]]+)\]\(([^)\s]+)\)/g, (all, label, url) => {
    const art = (artifacts || []).find(a => a.url === url);
    if (art && art.kind === 'model') return '<span data-dl="' + url + '"></span>';
    return `<a href="${url}" target="_blank" rel="noreferrer">${label}</a>`;
  });

  // 裸 URL：模型的转成下载按钮，其余普通链接
  (artifacts || []).filter(a => a.kind === 'model').forEach(a => {
    html = html.split(a.url).join(`<span data-dl="${a.url}"></span>`);
  });
  html = html.replace(/(^|[\s>])(https?:\/\/[^\s<]+)/g,
                      (all, pre, url) => `${pre}<a href="${url}" target="_blank" rel="noreferrer">${url}</a>`);

  html.split(/\n{2,}/).forEach(chunk => {
    if (!chunk.trim()) return;
    const p = document.createElement('p');
    p.innerHTML = chunk.replace(/\n/g, '<br>');
    container.appendChild(p);
  });

  // 占位按钮换成真下载按钮
  container.querySelectorAll('span[data-dl]').forEach(slot => {
    const url = slot.getAttribute('data-dl');
    const art = (artifacts || []).find(a => a.url === url);
    slot.replaceWith(downloadButton(art || { url }, true));
  });
}

function bubble(role, text, artifacts, loading) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role + (loading ? ' loading' : '');
  const b = document.createElement('div');
  b.className = 'bubble';
  wrap.appendChild(b);

  const arts = artifacts || [];
  if (role === 'user') {
    b.textContent = text;
  } else if (loading) {
    b.textContent = text;
  } else {
    renderRich(b, text || '', arts);
    const models = arts.filter(a => a.kind === 'model');
    models.forEach(a => b.appendChild(downloadButton(a, true)));
    if (models.length) {
      const note = document.createElement('p');
      note.className = 'hint';
      note.textContent = '模型保存到本地后即可拖进切片软件；链接 5 分钟内有效，过期请重新生成。';
      b.appendChild(note);
    }
  }
  chat.appendChild(wrap);
  scrollBottom();
  return wrap;
}

function history() {
  const items = [];
  chat.querySelectorAll('.msg').forEach(m => {
    if (m.classList.contains('loading')) return;
    const b = m.querySelector('.bubble');
    if (!b) return;
    const isUser = m.classList.contains('user');
    items.push({
      role: isUser ? 'user' : 'assistant',
      content: isUser ? b.textContent : (b.dataset.plain || b.textContent),
    });
  });
  return items;
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.onclick = send;

async function pollJob(jobId, loading) {
  const started = Date.now();
  const timer = setInterval(() => {
    const s = Math.round((Date.now() - started) / 1000);
    loading.querySelector('.bubble').textContent =
      `正在生成… 已等待 ${s}s（1–3 分钟正常）`;
  }, 1000);
  // 网关偶发 502/503/504：退避重试，不因一次抖动就废掉整轮
  let failures = 0;
  try {
    for (;;) {
      let rec = null;
      try {
        const res = await fetch('/api/job/' + encodeURIComponent(jobId),
                                { cache: 'no-store' });
        rec = await res.json();
      } catch (err) {
        failures += 1;
        if (failures > 12) {
          return { status: 'failed',
                   error: '轮询连续失败（网关不稳定），请刷新页面重新发起' };
        }
        await new Promise(r => setTimeout(r, Math.min(2000 * failures, 8000)));
        continue;
      }
      failures = 0;
      if (rec.status === 'succeeded' || rec.status === 'failed') return rec;
      if (rec.error) return rec;
      await new Promise(r => setTimeout(r, 2500));
    }
  } finally {
    clearInterval(timer);
  }
}

async function send() {
  const text = input.value.trim();
  const size = sizeBox.value ? `（目标最大边 ${sizeBox.value}mm）` : '';
  if ((!text && !pendingImages.length) || busy) return;
  busy = true; sendBtn.disabled = true;
  const outgoing = { role: 'user', content: text + size };
  if (pendingImages.length) outgoing.images = pendingImages.slice();
  pendingImages = []; renderThumbs();
  input.value = ''; input.style.height = 'auto';
  bubble('user', outgoing.content + (outgoing.images ? ` [📷 ×${outgoing.images.length}]` : ''));
  const loading = bubble('bot', '正在提交…', [], true);
  try {
    let data = null;
    for (let attempt = 1; attempt <= 3 && !data; attempt++) {
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history: [...history(), outgoing] }),
        });
        data = await res.json();
        if (data.error && attempt < 3) { await sleep(1500 * attempt); data = null; }
      } catch (e) {
        if (attempt === 3) data = { error: 'HTTP ' + (e && e.message || e) };
        else await sleep(1500 * attempt);
      }
    }
    if (data.error) {
      loading.remove();
      bubble('bot', '提交失败：' + data.error);
      return;
    }
    const rec = await pollJob(data.job_id, loading);
    loading.remove();
    const result = rec.result || {};
    if (rec.status === 'failed' || rec.error) {
      bubble('bot', '出错了：' + (rec.error || '任务失败'));
      if (result.artifacts && result.artifacts.length) {
        bubble('bot', '不过这一轮已经拿到交付件：', result.artifacts);
      }
      return;
    }
    const arts = result.artifacts || [];
    const node = bubble('bot', result.reply || '（无回复）', arts);
    node.querySelector('.bubble').dataset.plain = result.reply || '';
  } catch (err) {
    loading.remove();
    bubble('bot', '网络错误：' + err.message);
  } finally {
    busy = false; sendBtn.disabled = false;
    scrollBottom();
  }
}

fetch('/healthz').then(r => r.json()).then(d => {
  const chip = document.getElementById('status');
  const llm = d.llm || {};
  const ok = llm.configured === true;
  chip.textContent = ok
    ? '模型已就绪 · ' + (llm.model || '')
    : '未配置模型 token（PRINTGUARD_LLM_TOKEN）';
  chip.className = 'chip ' + (ok ? 'ok' : 'bad');
}).catch(() => {
  const chip = document.getElementById('status');
  chip.textContent = '服务未响应';
  chip.className = 'chip bad';
});
</script>
</body>
</html>
