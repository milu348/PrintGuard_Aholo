<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrintGuard_Aholo Demo</title>
<style>
 :root{--bg:#0f1115;--card:#161a22;--line:#2a2f3a;--fg:#e6e8ee;--dim:#8b93a3;--acc:#7c5cff;--ok:#4ade80}
 body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column}
 header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
 header b{font-size:16px} header .tag{font-size:12px;color:var(--dim)}
 #log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
 .msg{max-width:78%;padding:10px 14px;border-radius:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
 .user{align-self:flex-end;background:#2b3a67}
 .bot{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
 .trace{align-self:flex-start;font-size:12px;color:var(--dim);background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;max-width:78%}
 .trace .t{margin:2px 0} .trace .ok{color:var(--ok)}
 footer{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
 textarea{flex:1;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;resize:none;height:44px}
 button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:0 22px;font-size:15px;cursor:pointer}
 .hint{color:var(--dim);font-size:12px;padding:0 20px 8px}
</style></head>
<body>
<header><b>🛡️ PrintGuard_Aholo</b><span class="tag">网页 Demo · 调用魔搭 MCP 托管服务</span><span id="st" class="tag"></span></header>
<div id="log"></div>
<div class="hint">试试：「帮我检查这个模型能不能打印：https://www.modelscope.cn/datasets/miluzzz/printguard-assets/resolve/master/ahri_g1_300k.glb，高 130mm」</div>
<footer><textarea id="in" placeholder="描述你的需求，例如：帮我检查一个模型能不能 FDM 打印…"></textarea><button id="send">发送</button></footer>
<script>
const log = document.getElementById('log');
const add = (cls, text) => { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; };
const trace = () => { const d = document.createElement('div'); d.className = 'trace'; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; };

let busy = false;
document.getElementById('send').onclick = run;
document.getElementById('in').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); run(); } });

async function run() {
  if (busy) return;
  const inp = document.getElementById('in');
  const msg = inp.value.trim();
  if (!msg) return;
  inp.value = ''; busy = true;
  add('user', msg);
  const bot = add('bot', '思考中…');
  const tr = trace();
  try {
    const r0 = await fetch('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: msg})});
    const {sid, error} = await r0.json();
    if (error) { bot.textContent = '错误：' + error; busy = false; return; }
    let seen = 0;
    while (true) {
      await new Promise(r => setTimeout(r, 1200));
      const r = await fetch('/api/chat/' + sid);
      const j = await r.json();
      for (; seen < j.events.length; seen++) {
        const e = j.events[seen];
        if (e.type === 'final') { bot.textContent = e.payload.text; tr.innerHTML += '<div class="t ok">✔ 完成</div>'; busy = false; return; }
        if (e.type === 'tool_call') tr.innerHTML += '<div class="t">🔧 调用 ' + e.payload.name + '</div>';
        if (e.type === 'job') tr.innerHTML += '<div class="t">⏳ 任务 ' + (e.payload.stage || '') + (e.payload.elapsed_s ? ' · ' + e.payload.elapsed_s + 's' : '') + '</div>';
        if (e.type === 'tool_result') tr.innerHTML += '<div class="t ' + (e.payload.ok ? 'ok' : '') + '">📥 ' + e.payload.name + ' 返回</div>';
        if (e.type === 'info') tr.innerHTML += '<div class="t">' + e.payload.text + '</div>';
        log.scrollTop = log.scrollHeight;
      }
      bot.textContent = '工作中…';
    }
  } catch (e) { bot.textContent = '网络错误：' + e; busy = false; }
}
fetch('/api/health').then(r => r.json()).then(j => document.getElementById('st').textContent = '· MCP: ' + (j.ok ? '已连接' : '未连接'));
</script>
</body></html>
