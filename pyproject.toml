[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "PrintGuard_Aholo"
version = "0.6.0"
description = "PrintGuard_Aholo —— FDM 打印件的生成→可制造性校核→修复→交付（Lux3D + 几何工具链），MCP Server 形态"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
    "trimesh",
    "manifold3d",
    "scikit-image",
    "requests",
    "matplotlib",
    "lxml",
    "pillow",
    "uvicorn",
    # 代码用的是 mcp v1 的 FastMCP API；mcp 2.x 已改名为 MCPServer（不兼容）
    "mcp>=1,<2",
]

[project.optional-dependencies]
aholo = ["manycore-aholo-sdk-lux3d", "manycore-aholo-sdk-asset"]

[project.urls]
Repository = "https://github.com/milu348/PrintGuard_Aholo"

[project.scripts]
printguard-mcp = "mcp_server:main"
printguard-aholo = "mcp_server:main"

[tool.setuptools]
py-modules = ["printguard", "pipeline", "lux3d_client", "mcp_server"]
